<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello-api</title>
</head>
<body>
  <h1>hello-api</h1>
  <p>Live test.</p>
  <p>Response from <code>/api/hello</code>:</p>
  <pre id="out">loading…</pre>
  <script>
    fetch('/api/hello')
      .then((r) => r.json())
      .then((data) => { document.getElementById('out').textContent = JSON.stringify(data, null, 2); })
      .catch((err) => { document.getElementById('out').textContent = 'Error: ' + err.message; });
  </script>
</body>
</html>
