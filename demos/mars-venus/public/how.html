<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>How I built it · Swipe the Moment</title>
  <meta name="description" content="How a 1992 relationship book became a 30-second game, with every idea checked against reader reviews and research.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2235%22 cy=%2250%22 r=%2226%22 fill=%22%23e4572e%22/%3E%3Ccircle cx=%2275%22 cy=%2250%22 r=%2218%22 fill=%22%23f4b400%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { overflow: auto; height: auto; }
    .how { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 22px 20px 60px; }
    .how a.back { display: inline-block; margin-bottom: 28px; }
    .how h1 { font-size: 44px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; margin: 6px 0 10px; line-height: 1; }
    .how .lede { font-size: 19px; line-height: 1.45; color: #e9ecef; max-width: 36em; margin: 0 0 28px; }
    .glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 14px; }
    .glance div { border: 1px solid var(--faint); padding: 14px 10px; text-align: center; }
    .glance b { display: block; font-size: 38px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .lights { display: flex; height: 12px; margin: 6px 0 6px; border: 1px solid var(--faint); }
    .lights span { display: block; height: 100%; }
    .lights-key { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--dim); margin-bottom: 40px; }
    .lights-key i { margin-right: 6px; vertical-align: -1px; }
    .steps { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
    .steps > li { position: relative; padding: 0 0 38px 28px; }
    .steps > li::before { content: attr(data-n); position: absolute; left: -15px; top: -2px; width: 28px; height: 28px; border-radius: 50%;
      background: #000; border: 1px solid var(--fg); display: grid; place-items: center; font-size: 13px; }
    .steps h2 { margin: 0 0 6px; font-size: 22px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
    .steps p { margin: 0 0 12px; font-size: 17px; line-height: 1.5; color: #e9ecef; max-width: 36em; }
    .steps figure { margin: 10px 0 0; }
    .steps img { display: block; max-width: 100%; height: auto; border: 1px solid var(--faint); border-radius: 6px; background: #fff; }
    .steps img.phone { max-width: 260px; background: none; border-radius: 18px; }
    .steps img.tall { max-width: 360px; }
    .steps figcaption { font-size: 13px; color: var(--dim); margin-top: 6px; line-height: 1.4; }
    .pair { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 40px; }
    .tool { border: 1px solid var(--line); padding: 8px 12px; font-size: 13px; }
    .tool b { display: block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 500; color: var(--dim); margin-bottom: 2px; }
    .honest { border: 1px solid var(--line); padding: 16px 18px; margin-bottom: 30px; }
    .honest h2 { margin: 0 0 8px; font-size: 18px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
    .honest ul { margin: 0; padding-left: 18px; } .honest li { margin: 6px 0; font-size: 15px; line-height: 1.45; color: #e9ecef; }
    @media (max-width: 560px) { .glance { grid-template-columns: repeat(2, 1fr); } .how h1 { font-size: 34px; } }
    .howtop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .howtop a.back { margin: 0; }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <main class="how">
    <div class="howtop"><a class="link back" data-href="./" data-i18n="how.back">← Back to the game</a><nav id="langSwitch" class="langs" aria-label="Language"></nav></div>
    <span class="label" data-i18n="how.kicker">How I built it</span>
    <h1>Swipe the Moment</h1>
    <p class="lede" data-i18n="how.lede"></p>

    <div class="glance">
      <div><b data-k="reviews">124</b><span class="label" data-i18n="how.reviews"></span></div>
      <div><b data-k="quotes">43</b><span class="label" data-i18n="how.quotes"></span></div>
      <div><b data-k="ideas">13</b><span class="label" data-i18n="how.ideas"></span></div>
      <div><b data-k="moments">52</b><span class="label" data-i18n="how.moments"></span></div>
    </div>
    <div class="lights" id="lights" role="img" data-i18n-aria="how.lightsAria"></div>
    <div class="lights-key" id="lightsKey"></div>

    <ol class="steps">
      <li data-n="1"><h2 data-i18n="how.s1.title"></h2><p data-i18n="how.s1.p1"></p><p data-i18n="how.s1.p2"></p></li>
      <li data-n="2"><h2 data-i18n="how.s2.title"></h2><p data-i18n="how.s2.p1"></p><p data-i18n="how.s2.p2"></p></li>
      <li data-n="3"><h2 data-i18n="how.s3.title"></h2><p data-i18n="how.s3.p1"></p>
        <figure><img class="tall" src="img/how-1-idea-map.jpg" data-i18n-alt="how.s3.alt" alt="" loading="lazy"><figcaption data-i18n="how.s3.cap"></figcaption></figure></li>
      <li data-n="4"><h2 data-i18n="how.s4.title"></h2><p data-i18n="how.s4.p1"></p>
        <div class="pair">
          <figure><img src="img/how-2-first-sketch.jpg" data-i18n-alt="how.s4.alt1" alt="" loading="lazy"><figcaption data-i18n="how.s4.cap1"></figcaption></figure>
          <figure><img src="img/how-4-storyboard.jpg" data-i18n-alt="how.s4.alt2" alt="" loading="lazy"><figcaption data-i18n="how.s4.cap2"></figcaption></figure>
        </div></li>
      <li data-n="5"><h2 data-i18n="how.s5.title"></h2><p data-i18n="how.s5.p1"></p>
        <figure><img src="img/how-3-cast.jpg" data-i18n-alt="how.s5.alt" alt="" loading="lazy"><figcaption data-i18n="how.s5.cap"></figcaption></figure></li>
      <li data-n="6"><h2 data-i18n="how.s6.title"></h2><p data-i18n="how.s6.p1"></p><p data-i18n="how.s6.p2"></p><p data-i18n="how.s6.p3"></p></li>
      <li data-n="7"><h2 data-i18n="how.s7.title"></h2><p data-i18n="how.s7.p1"></p>
        <figure><img class="phone" src="img/how-5-game.jpg" data-i18n-alt="how.s7.alt" alt="" loading="lazy"><figcaption data-i18n="how.s7.cap"></figcaption></figure></li>
    </ol>

    <span class="label" data-i18n="how.tools"></span>
    <div class="tools">
      <span class="tool"><b data-i18n="how.t.research"></b>Firecrawl</span>
      <span class="tool"><b data-i18n="how.t.sketch"></b>Excalidraw</span>
      <span class="tool"><b data-i18n="how.t.claude"></b>Claude Code · Claude Opus 5.5</span>
      <span class="tool"><b data-i18n="how.t.codex"></b>Codex · GPT-6.2 Sol</span>
      <span class="tool"><b data-i18n="how.t.map"></b>graphify</span>
      <span class="tool"><b data-i18n="how.t.host"></b>Cloudflare Pages</span>
    </div>

    <section class="honest">
      <h2 data-i18n="how.honest"></h2>
      <ul><li data-i18n="how.h1"></li><li data-i18n="how.h2"></li><li data-i18n="how.h3"></li><li data-i18n="how.h4"></li></ul>
    </section>

    <a class="btn solid" data-href="./" data-i18n="how.play"></a>
  </main>
  <script src="i18n.js"></script>
  <script>
    // Words come from i18n.js (English + Vietnamese); numbers come from the same data file the game uses.
    const I18N = window.I18N || { en: {} }, q = new URLSearchParams(location.search).get("lang");
    const L = ["en", "vi"].includes(q) && I18N[q] ? q : (navigator.language || "").toLowerCase().startsWith("vi") && I18N.vi ? "vi" : "en";
    const T = (k) => (I18N[L] && I18N[L][k]) ?? I18N.en[k] ?? k;
    const langQ = "?lang=" + L;
    document.documentElement.lang = L; document.title = T("how.title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = T(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-alt]").forEach((el) => { el.alt = T(el.dataset.i18nAlt); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", T(el.dataset.i18nAria)); });
    document.querySelectorAll("[data-href]").forEach((el) => { el.href = el.dataset.href + langQ; });
    document.getElementById("langSwitch").setAttribute("aria-label", T("lang.switch"));
    document.getElementById("langSwitch").innerHTML = ["en", "vi"].map((k) => `<a href="?lang=${k}" lang="${k}" ${k === L ? 'aria-current="true"' : ""}>${k.toUpperCase()}</a>`).join("<span>|</span>");
    fetch("data/content.json").then((r) => r.json()).then((c) => {
      const n = { reviews: c.reviewsRead, quotes: c.quotesChecked, ideas: c.ideas.length, moments: c.ideas.reduce((a, i) => a + i.scenarios.length, 0) };
      document.querySelectorAll("[data-k]").forEach((el) => { el.textContent = n[el.dataset.k]; });
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.innerHTML = el.innerHTML.replace(/\{(\w+)\}/g, (m, k) => (k in n ? n[k] : m)); });
      const order = ["GREEN", "AMBER", "RED", "GREY"], key = { GREEN: "plan.keyGreen", AMBER: "plan.keyAmber", RED: "plan.keyRed", GREY: "plan.keyGrey" };
      const col = { GREEN: "#69db7c", AMBER: "#ffc078", RED: "#ff6b6b", GREY: "#adb5bd" };
      const count = Object.fromEntries(order.map((k) => [k, c.ideas.filter((i) => i.light === k).length]));
      document.getElementById("lights").innerHTML = order.map((k) => `<span style="width:${(count[k] / c.ideas.length) * 100}%;background:${col[k]}"></span>`).join("");
      document.getElementById("lightsKey").innerHTML = order.map((k) => `<span><i class="dot ${k}"></i>${count[k]} ${T(key[k])}</span>`).join("");
    }).catch(() => {});
    // The same starfield as the game, without motion if the reader prefers less.
    const cv = document.getElementById("stars"), cx = cv.getContext("2d"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let W, H, s = [];
    const size = () => { const d = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
      s = Array.from({ length: Math.round((W * H) / 3500) }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.9 + 0.1, p: Math.random() * 6.28 })); };
    const draw = (t) => { cx.clearRect(0, 0, W, H); for (const p of s) { const a = still ? 0.7 : 0.45 + 0.45 * Math.sin(t / 900 * p.z + p.p); cx.fillStyle = `rgba(255,255,255,${a * p.z + 0.1})`; cx.fillRect(p.x, p.y, p.z * 1.6, p.z * 1.6); } if (!still) requestAnimationFrame(draw); };
    addEventListener("resize", size); size(); requestAnimationFrame(draw);
  </script>
</body>
</html>
