name: cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      name:
        description: Demo name (without demo/), e.g. my-demo
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  delete-deployments:
    # Same-repo demo/* branches only, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'demo/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: deploy.config
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Delete this demo's Pages deployments
        env:
          RAW_NAME: ${{ inputs.name || github.head_ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          name="${RAW_NAME#demo/}"
          [[ "$name" =~ ^[a-z][-a-z0-9]{0,22}[a-z0-9]$ ]] || { echo "::error::Bad demo name: $name"; exit 1; }
          branch="demo-$name"
          project="$(sed -n 's/^PAGES_PROJECT=//p' deploy.config)"
          [[ "$project" =~ ^[a-z0-9][-a-z0-9]*$ ]] || { echo "::error::deploy.config: set PAGES_PROJECT to your Cloudflare Pages project name"; exit 1; }
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/deployments"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          # Collect every id first (until an empty page); deleting while paging would shift the pages.
          ids=() page=1
          while :; do
            resp="$(curl -fsS -H "$auth" "$api?env=preview&per_page=25&page=$page")"
            mapfile -t found < <(jq -r --arg b "$branch" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<<"$resp")
            (( $(jq '.result | length' <<<"$resp") > 0 )) || break
            ids+=("${found[@]}")
            page=$((page + 1))
          done

          echo "Found ${#ids[@]} deployment(s) for branch $branch"
          for id in "${ids[@]}"; do
            curl -fsS -X DELETE -H "$auth" "$api/$id?force=true" > /dev/null
            echo "deleted $id"
          done
