name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  deploy:
    # Same-repo demo/* branches only: fork PRs never get the Cloudflare secrets.
    if: startsWith(github.head_ref, 'demo/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check who pushed
        # Collaborators may change only demos whose PR they opened; the repo owner may change any.
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$ACTOR" == "$AUTHOR" || "$ACTOR" == "$OWNER" ]] || {
            echo "::error::$ACTOR may not change this demo: only its PR author ($AUTHOR) or $OWNER can."
            exit 1
          }

      - name: Check name and changed paths
        id: demo
        run: |
          name="${HEAD_REF#demo/}"
          scripts/check-paths "$name" "$BASE_SHA" "$HEAD_SHA"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read the Pages project name
        id: cfg
        run: |
          project="$(sed -n 's/^PAGES_PROJECT=//p' deploy.config)"
          [[ "$project" =~ ^[a-z0-9][-a-z0-9]*$ ]] || { echo "::error::deploy.config: set PAGES_PROJECT to your Cloudflare Pages project name"; exit 1; }
          echo "project=$project" >> "$GITHUB_OUTPUT"

      - name: Stage
        env:
          NAME: ${{ steps.demo.outputs.name }}
        run: scripts/stage "$NAME"

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: .stage
        env:
          NAME: ${{ steps.demo.outputs.name }}
          PROJECT: ${{ steps.cfg.outputs.project }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Run from .stage so wrangler also picks up .stage/functions.
          # --force keeps the deploy on classic Pages (pages.dev); wrangler 4.163+ may otherwise hand it to Workers.
          npx --yes wrangler@4.163.0 pages deploy public \
            --project-name "$PROJECT" \
            --branch "demo-$NAME" \
            --commit-hash "$HEAD_SHA" \
            --commit-dirty=true \
            --force 2>&1 | tee deploy.log
          # Prefer the stable branch alias; fall back to the per-deploy URL.
          url="$(grep -i 'alias' deploy.log | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | tail -1 || true)"
          [[ -n "$url" ]] || url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          [[ -n "$url" ]] || { echo "::error::No pages.dev URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          marker='<!-- demo-preview -->'
          body="$marker
          **Preview:** $URL
          Commit: ${HEAD_SHA:0:7}. Push again to update; close this PR to take the demo down."
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")"
          id="${id%%$'\n'*}" # first match only; avoids `| head -1` SIGPIPE under pipefail
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
